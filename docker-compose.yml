services:
  db:
    image: postgres:16-alpine
    container_name: rentalcar-db
    environment:
      POSTGRES_DB: rentalcardb
      POSTGRES_USER: vidhan
      POSTGRES_PASSWORD: vidhan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidhan -d rentalcardb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rentalcar-network

  redis:
    image: redis:7-alpine
    container_name: rentalcar-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rentalcar-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rentalcar-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - rentalcar-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rentalcar-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - rentalcar-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentalcar-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/rentalcardb
      - DB_USER=vidhan
      - DB_PASSWORD=vidhan
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_SERVERS=kafka:9092
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - COOKIE_SECURE=false
      - SERVER_PORT=8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - rentalcar-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=
    container_name: rentalcar-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rentalcar-network

volumes:
  pgdata:
  redisdata:

networks:
  rentalcar-network:
    driver: bridge
